name: 追蹤上游更新

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'CloudWorkTools/UAV-Downloader'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 比較上游已提交更新與本專案差異
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git fetch --no-tags https://github.com/Alos21750/UAV-Downloader.git master
          python3 scripts/compare_upstream.py HEAD FETCH_HEAD > "$RUNNER_TEMP/upstream-report.md"
          cat "$RUNNER_TEMP/upstream-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: 更新固定差異追蹤紀錄
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue=$(gh issue list --state all --search '"[追蹤] 上游版本與本專案差異" in:title' --limit 100 --json number,title --jq '[.[] | select(.title == "[追蹤] 上游版本與本專案差異")][0].number // empty')
          if [ -n "$issue" ]; then
            gh issue reopen "$issue"
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/upstream-report.md"
          else
            gh issue create --title '[追蹤] 上游版本與本專案差異' --body-file "$RUNNER_TEMP/upstream-report.md"
          fi
