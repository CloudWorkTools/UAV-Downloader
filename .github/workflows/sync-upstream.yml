name: 追蹤上游更新

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'CloudWorkTools/UAV-Downloader'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 建立上游同步 PR 並啟動相容性檢查
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git fetch --no-tags https://github.com/Alos21750/UAV-Downloader.git master
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo '上游版本已包含在目前分支。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="sync/upstream-${upstream_sha:0:12}"
          gh auth setup-git
          git push origin "$upstream_sha:refs/heads/$branch"
          pr_url=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            {
              echo '## 上游更新評估'
              echo
              echo '來源：Alos21750/UAV-Downloader 的 master 分支。'
              echo
              echo '此 PR 保留上游提交；不會直接更新本專案主分支。'
              echo 'Web / UI compatibility 會先嘗試合併目前主分支，再執行 NAS、佇列、選取操作與容器啟動測試。'
              echo '請確認檢查成功，並檢視 Web、NAS 與工作流程的差異後，再由維護者決定是否合併。'
              echo '測試通過僅代表已覆蓋情境通過，實際站點與個別 NAS 仍需抽查。'
              echo
              echo '提交：'
              git log -15 --format='%h %s' "HEAD..$upstream_sha"
            } > "$RUNNER_TEMP/upstream-pr.md"
            pr_url=$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title 'chore: 評估上游更新' --body-file "$RUNNER_TEMP/upstream-pr.md")
          fi
          gh workflow run web-check.yml --ref "$BASE_BRANCH" -f candidate_sha="$upstream_sha"
          echo "同步 PR：$pr_url；已啟動相容性檢查，等待維護者判斷。" >> "$GITHUB_STEP_SUMMARY"
