name: Web 與 UI 相容性檢查

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: '待評估的上游提交 SHA；留空檢查目前分支'
        required: false
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    name: Web / UI compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 將上游候選版本與主分支合併測試
        if: inputs.candidate_sha != ''
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'Compatibility check'
          git config user.email 'compatibility@users.noreply.github.com'
          git fetch origin "$BASE_BRANCH"
          git merge --no-edit FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安裝無介面測試依賴
        run: python -m pip install -r requirements-docker.txt pytest PySocks customtkinter Pillow
      - name: 測試 NAS、設定、下載佇列與核心儲存行為
        run: python -m pytest -q tests/test_nas.py tests/test_daemon.py tests/test_proxy.py tests/test_storage_failures.py tests/test_resolution_pref.py tests/test_compare_upstream.py tests/test_category_catalog.py
      - name: 測試清單、預覽圖、全選與批次下載
        run: |
          node tests/web_ui.cjs
          node tests/web_browse.cjs
          node tests/category_browser.cjs
      - name: 建置並啟動 Web 容器
        run: |
          docker build -f Dockerfile.web -t uav-web-check .
          bash scripts/check_web_container.sh uav-web-check
      - name: 評估摘要
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "相容性檢查：$RESULT。成功後仍需維護者檢視 Web、NAS 與工作流程差異；失敗時請勿合併。" >> "$GITHUB_STEP_SUMMARY"

  candidate-status:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.candidate_sha != ''
    needs: compatibility
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: 將結果標示於候選提交
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RESULT: ${{ needs.compatibility.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          conclusion=failure
          if [ "$RESULT" = success ]; then conclusion=success; fi
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Web / UI compatibility' -f head_sha="$CANDIDATE_SHA" \
            -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
            -f 'output[title]=上游相容性評估' \
            -f "output[summary]=測試結果：$RESULT。請檢視執行紀錄與差異後再決定是否合併。"
