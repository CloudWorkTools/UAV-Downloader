name: docker-publish

# Builds UAV Downloader CLI and publishes the canonical image plus transition
# aliases so existing NAS deployments keep receiving updates.
on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements-docker.txt'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  build-and-push:
    if: github.repository == 'Alos21750/UAV-Downloader' || github.event_name == 'workflow_dispatch'
    runs-on:
      group: shared-runners
      labels: [self-hosted, Linux, X64, shared]
    permissions:
      contents: read
      packages: write        # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3          # arm64 emulation
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/uav-downloader
            ghcr.io/${{ github.repository_owner }}/alos-unified-av-downloader
            ghcr.io/${{ github.repository_owner }}/jabletv
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
